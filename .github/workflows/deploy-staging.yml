name: Deploy to Staging

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/SlideKit
            git fetch origin
            git checkout dev
            git pull origin dev
            npm install
            npm run build
            pm2 restart slidekit-staging || pm2 start npm --name slidekit-staging -- start -- -p 3009
            pm2 save
